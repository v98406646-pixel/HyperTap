# Инструкция для GitHub: сборка приложения HyperTap

## 1. Что нужно сделать GitHub
Собрать Android-приложение **HyperTap** (автокликер с компактной плавающей панелью управления, перетаскиваемым кружочком-мишенью и настройками интервала/лимита кликов).

## 2. Откуда брать картинку и название
- **Название приложения:** `HyperTap` (прописать в ресурсах и отображать на главном экране приложения).
- **Картинка иконки:** GitHub должен искать файл `icon.png` в корне репозитория (рядом с `index.html`) и подставить его на иконку приложения (`ic_launcher` и `ic_launcher_round` в папки `mipmap-*`). Если `icon.png` в корне нет — сборка не должна падать, а использовать стандартную иконку.

## 3. Какие разрешения нужно добавить в приложение
- `SYSTEM_ALERT_WINDOW` — чтобы плавающая панель и кружок-мишень отображались поверх других окон и игр.
- Служба `AccessibilityService` с параметром `android:canPerformGestures="true"` — чтобы выполнять реальные нажатия по координатам кружка-мишени.
- `POST_NOTIFICATIONS` — для корректной работы уведомлений на новых версиях Android.

## 4. Как запускать и забирать готовый файл
1. Убедись, что в корне ветки `main` лежат `icon.png` и `index.html`, а в `.github/workflows/build.yml` настроен workflow сборки.
2. Запусти сборку во вкладке **Actions** (кнопка **Run workflow**).
3. После успешного завершения скачай готовый APK из раздела **Artifacts** и установи на Android.
